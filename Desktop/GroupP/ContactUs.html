<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Messi Fan Club</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#fafafa; }
    header { background:#000; color:#fff; text-align:center; padding:40px; }
    header h1 { margin:0; }
    nav { background:#333; padding:10px; text-align:center; }
    nav a { color:#fff; margin:0 15px; text-decoration:none; font-weight:bold; }
    nav a:hover { color:#ffd700; }

    .section { padding:40px; text-align:center; }
    .info-box {
      background:#fff; border:2px solid #ddd; border-radius:10px;
      padding:20px; max-width:600px; margin:20px auto; text-align:left;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }
    .info-box h2 { color:#222; margin-bottom:15px; }
    .info-box p { color:#555; line-height:1.6; }
    form { display:flex; flex-direction:column; gap:15px; }
    input, textarea { padding:10px; border:1px solid #ccc; border-radius:5px; font-size:1em; }
    button { padding:10px; border:none; background:#333; color:#fff; border-radius:5px; cursor:pointer; }
    button:hover { background:#555; }
    footer { background:#222; color:#fff; text-align:center; padding:20px; margin-top:40px; }
  </style>
</head>
<body>
  <header>
    <h1>Messi Fan Club</h1>
    <p>Celebrating the Legend – Lionel Messi</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="aboutUs.html">About US</a>
    <a href="ContactUs.html">Contact Us</a>
    <a href="Products.html">Products</a>
  </nav>


  <div class="section">
    <div class="info-box">
      <h2>Get in Touch</h2>
      <p>We’d love to hear from you! Whether you have questions, feedback, or fan stories to share, reach out below.</p>
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2026 Messi Fan Club | Follow us on Instagram, Twitter, YouTube</p>
  </footer>
</body>
</html>
